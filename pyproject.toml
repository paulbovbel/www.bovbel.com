[project]
name = "paul-bovbel-com"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "boto3",
    "requests",
    "pytest",
    "pymupdf",
    "aws-cdk-lib",
    "constructs",
]

[project.scripts]
serve-site = "bovbel_site.websites.local:serve_main"
build-site = "bovbel_site.websites.local:build_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bovbel_site"]

[tool.pytest.ini_options]
addopts = "-m 'not post_deploy and not external and not build_artifact' --strict-markers"
markers = [
    "pre_deploy: tests that run before deployment (local files)",
    "post_deploy: tests that run after deployment (live site)",
    "external: scheduled third-party link checks",
    "build_artifact: checks against the exact site output prepared for deployment",
]
