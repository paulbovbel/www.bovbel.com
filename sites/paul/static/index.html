<!DOCTYPE html>
<html lang="en">

<head>

    gtag('config', 'G-57Q5PWFEVM');

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google-site-verification" content="RFzqWU89ZSo966nh1NqUWmU78bJNclDONjLG4EqbPGw">

  <title>Paul Bovbel</title>

  <style>
    :root {
      color-scheme: light;
      --ink: #202124;
      --muted: #5f6368;
      --paper: #f8f9fa;
      --accent: #1a73e8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--paper);
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0 auto;
      padding: 1.5rem;
    }

    .avatar {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      object-fit: cover;
    }

    .profile {
      text-align: center;
      padding: 1rem;
    }

    h1 {
      margin: 1.15rem 0 0;
      font-size: clamp(2rem, 8vw, 3rem);
      font-weight: 600;
      letter-spacing: -0.04em;
    }

    .links {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.35rem 0.85rem;
      margin: 1rem 0 0.9rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      text-underline-offset: 0.18em;
    }

    .links a:hover,
    .links a:focus-visible {
      text-decoration: underline;
    }

    .contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.2rem;
      color: var(--muted);
      font-size: 0.95rem;
      margin: 0;
    }

    .contact img {
      height: 1em;
      width: auto;
      vertical-align: -0.12em;
    }

    @media (max-width: 420px) {
      .links {
        flex-direction: column;
      }
    }
  </style>
</head>

<body>
  <main class="container">
    <section class="profile" aria-labelledby="site-title">
      <img class="avatar" src="/images/paul-bovbel.jpg" alt="Paul Bovbel">
      <h1 id="site-title">Paul Bovbel</h1>

      <nav class="links" aria-label="Profile links">
        <a href="./resume.pdf">Resume</a>
        <a href="https://github.com/paulbovbel">GitHub</a>
        <a href="https://linkedin.com/in/bovbel">LinkedIn</a>
        <a href="https://www.printables.com/@paulbovbel">Printables</a>
      </nav>

      <p class="contact">
        Contact: paul<img src="/images/sign.jpg" alt=" at ">bovbel.com
      </p>
    </section>
  </main>
</body>

</html>
