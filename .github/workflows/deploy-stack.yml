name: Deploy stack

on:
  workflow_call:
    inputs:
      stack:
        description: CDK stack to deploy
        required: true
        type: string
      site:
        description: Site to smoke-test; omit for infrastructure-only stacks
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: 'true'
      STACK: ${{ inputs.stack }}
      SITE: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cloud-assembly
          path: cdk.out
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: arn:aws:iam::713134244406:role/${{ inputs.stack }}-deploy
          aws-region: us-east-1
      - name: Deploy tested stack
        run: nix develop --command cdk deploy --app cdk.out --require-approval never --exclusively "$STACK"
      - name: Run post-deploy smoke tests
        if: inputs.site != ''
        run: nix develop --command uv run pytest tests -v -m post_deploy --site "$SITE"
