name: Deploy stack

on:
  workflow_call:
    inputs:
      stack:
        description: CDK stack to deploy
        required: true
        type: string
      site:
        description: Site to smoke-test; omit for infrastructure-only stacks
        default: ''
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      UV_LOCKED: 'true'
      STACK: ${{ inputs.stack }}
      SITE: ${{ inputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: cloud-assembly
          path: cdk.out
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::713134244406:role/${{ inputs.stack }}-deploy
          aws-region: us-east-1
      - name: Deploy tested stack
        run: nix develop --command cdk deploy --app cdk.out --require-approval never --exclusively "$STACK"
      - name: Run post-deploy smoke tests
        if: inputs.site != ''
        run: nix develop --command uv run pytest tests -v -m post_deploy --site "$SITE"
