name: Deploy sites

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: '17 21 * * 2'

# Finish production updates before starting another one. PR checks can be replaced.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('ci-pr-{0}', github.event.pull_request.number) || 'deploy-sites' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      deploy: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/master' }}
      paul: ${{ steps.changes.outputs.paul }}
      rebecca: ${{ steps.changes.outputs.rebecca }}
      dns: ${{ steps.changes.outputs.dns }}
      # Manual and scheduled runs deploy all three stacks.
      shared: ${{ steps.changes.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    env:
      UV_LOCKED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          lfs: true
      - uses: ./.github/actions/setup
      - name: Lint workflows
        run: nix develop --command actionlint
      - name: Run local tests
        run: nix develop --command uv run pytest tests -v --durations=10
      - name: Build and validate sites
        run: |
          for site in paul rebecca; do
            nix develop --command uv run build-site --site "$site"
            nix develop --command uv run pytest tests -v -m build_artifact --site "$site"
          done
      - name: Synthesize stacks
        run: nix develop --command cdk synth --quiet --no-lookups -c prebuilt=true
      - name: Detect deployment changes
        if: github.event_name == 'push'
        id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          base: master
          filters: |
            shared:
              - '.github/**'
              - 'flake.*'
              - '{pyproject.toml,uv.lock,.python-version,cdk*.json}'
              - 'tests/**'
              - 'bovbel_site/shared/**'
              - 'bovbel_site/{app,__init__}.py'
            websites: &websites
              - 'sites/common/**'
              - 'bovbel_site/websites/**'
            paul:
              - *websites
              - 'sites/paul/**'
            rebecca:
              - *websites
              - 'sites/rebecca/**'
            dns:
              - 'bovbel_site/dns/**'
      - name: Save tested cloud assembly
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cloud-assembly
          path: cdk.out/
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy-paul:
    name: Deploy Paul
    needs: validate
    if: needs.validate.outputs.deploy == 'true' && (needs.validate.outputs.paul == 'true' || needs.validate.outputs.shared == 'true')
    uses: ./.github/workflows/deploy-stack.yml
    permissions:
      contents: read
      id-token: write
    with:
      stack: paul-bovbel-com
      site: paul

  deploy-rebecca:
    name: Deploy Rebecca
    needs: validate
    if: needs.validate.outputs.deploy == 'true' && (needs.validate.outputs.rebecca == 'true' || needs.validate.outputs.shared == 'true')
    uses: ./.github/workflows/deploy-stack.yml
    permissions:
      contents: read
      id-token: write
    with:
      stack: rebecca-bovbel-com
      site: rebecca

  deploy-dns:
    name: Deploy DNS
    needs: validate
    if: needs.validate.outputs.deploy == 'true' && (needs.validate.outputs.dns == 'true' || needs.validate.outputs.shared == 'true')
    uses: ./.github/workflows/deploy-stack.yml
    permissions:
      contents: read
      id-token: write
    with:
      stack: bovbel-com-dns
