name: External links

on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * 2'

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: true

jobs:
  links:
    name: Check third-party links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Check external HTML and PDF links
        run: nix develop --command uv run pytest tests -v -m external
