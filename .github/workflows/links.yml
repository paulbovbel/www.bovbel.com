name: External links

on:
  workflow_dispatch:
  schedule:
    - cron: '47 21 * * 2'

permissions:
  contents: read

concurrency:
  group: external-links
  cancel-in-progress: true

jobs:
  links:
    name: Check third-party links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      UV_LOCKED: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: ./.github/actions/setup
      - name: Check external HTML and PDF links
        run: nix develop --command uv run pytest tests -v -m external
