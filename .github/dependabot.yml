version: 2
multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: github-actions
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies

  - package-ecosystem: uv
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies

  - package-ecosystem: nix
    directory: /
    patterns: ['*']
    multi-ecosystem-group: dependencies
